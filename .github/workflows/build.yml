name: Build Windows VST3 Demo

on:
  workflow_dispatch:
  push:
    branches:
      - demo

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate German phrase bank
        shell: pwsh
        run: python tools/validate_phrase_candidates.py

      - name: Validate English phrase bank
        shell: pwsh
        run: python tools/validate_english_phrase_candidates.py

      - name: Configure Demo
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMOTIVATOR_DEMO_BUILD=ON -DSMTG_CREATE_PLUGIN_LINK=0 -DSMTG_CREATE_BUNDLE_FOR_WINDOWS=1

      - name: Build Motivator Demo
        id: build_step
        shell: pwsh
        run: |
          cmake --build build --config Release --target MotivatorDemo --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: MotivatorDemo-Build-Log
          path: build-log.txt
          if-no-files-found: warn

      - name: Locate MotivatorDemo VST3 bundle
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\build"
          $artifact = "$env:GITHUB_WORKSPACE\artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $bundles = Get-ChildItem $root -Recurse -Directory -Filter "MotivatorDemo.vst3" -ErrorAction SilentlyContinue
          $p = $bundles | Where-Object { Test-Path (Join-Path $_.FullName "Contents") } | Select-Object -First 1
          if (-not $p) { throw "MotivatorDemo.vst3 bundle not found" }
          Write-Host "VST3 bundle: $($p.FullName)"
          Copy-Item $p.FullName "$artifact\MotivatorDemo.vst3" -Recurse -Force

      - name: Upload Motivator Demo VST3 bundle
        uses: actions/upload-artifact@v5
        with:
          name: MotivatorDemo-Windows-VST3
          path: artifact
          if-no-files-found: error
